spring:
  application:
    name: fashion-ecommerce
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fashion_ecommerce}
    username: ${DATABASE_USERNAME:fashion_app}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
