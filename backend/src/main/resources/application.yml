spring:
  application:
    name: fashion-ecommerce
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fashion_ecommerce}
    username: ${DATABASE_USERNAME:fashion_app}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

app:
  upload:
    review-dir: ${REVIEW_UPLOAD_DIR:uploads/reviews}
