# Database RIÊNG cho test (tạo trước: CREATE DATABASE fashion_test;). Không trỏ vào DB dev đang có dữ liệu.
spring.datasource.url=jdbc:postgresql://localhost:5432/fashion_test
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
