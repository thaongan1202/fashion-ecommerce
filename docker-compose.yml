services:
  database:
    image: postgres:17-alpine
    container_name: fashion-ecommerce-db
    environment:
      POSTGRES_DB: fashion_ecommerce
      POSTGRES_USER: fashion_app
      # Local development only. Port is bound to localhost; do not reuse for deployment.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fashion-ecommerce-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion_app -d fashion_ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  fashion-ecommerce-postgres:
